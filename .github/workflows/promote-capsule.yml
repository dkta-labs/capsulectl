name: Promote dependency capsule

on:
  workflow_call:
    inputs:
      artifact-run-id:
        description: Workflow run containing the credential-blind promotion bundle
        required: true
        type: string
      artifact-name:
        description: Promotion input artifact name
        required: true
        type: string
      destination:
        description: Explicit non-latest ghcr.io image tag
        required: true
        type: string
      source-revision:
        description: Reviewed full Git commit SHA
        required: true
        type: string
      promoter-sha256:
        description: Reviewed SHA-256 of the fixed Linux capsule-promoter binary
        required: true
        type: string
      attest-registry-digest:
        description: Require a GitHub build-provenance attestation for the promoted digest
        required: false
        type: boolean
        default: true
    outputs:
      image:
        description: Promoted immutable registry digest
        value: ${{ jobs.promote.outputs.image }}

permissions: {}

jobs:
  promote:
    runs-on: ubuntu-24.04
    environment: capsule-promotion
    permissions:
      actions: read
      artifact-metadata: write
      attestations: write
      id-token: write
      packages: write
    outputs:
      image: ${{ steps.promote.outputs.image }}
    steps:
      - name: Validate fixed promotion inputs
        env:
          DESTINATION: ${{ inputs.destination }}
          EXPECTED_REVISION: ${{ inputs.source-revision }}
          EXPECTED_PROMOTER_SHA256: ${{ inputs.promoter-sha256 }}
        run: |
          case "$DESTINATION" in
            ghcr.io/${{ github.repository_owner }}/*:latest) exit 1 ;;
            ghcr.io/${{ github.repository_owner }}/*:*) ;;
            *) exit 1 ;;
          esac
          test "${#EXPECTED_REVISION}" -eq 40
          test "${#EXPECTED_PROMOTER_SHA256}" -eq 64
          case "$EXPECTED_REVISION$EXPECTED_PROMOTER_SHA256" in *[!0-9a-f]*) exit 1 ;; esac
      - name: Download credential-blind promotion bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.artifact-name }}
          path: promotion-input
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.artifact-run-id }}
      - name: Verify fixed promoter binary
        env:
          EXPECTED_PROMOTER_SHA256: ${{ inputs.promoter-sha256 }}
        run: |
          printf '%s  %s\n' "$EXPECTED_PROMOTER_SHA256" promotion-input/capsule-promoter | sha256sum --check --strict
          chmod 0500 promotion-input/capsule-promoter
      - name: Authenticate fixed promoter to GHCR
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin
      - name: Promote verified capsule without source checkout
        id: promote
        env:
          DESTINATION: ${{ inputs.destination }}
          REVIEWED_REVISION: ${{ inputs.source-revision }}
        run: |
          promotion-input/capsule-promoter \
            --bundle promotion-input/promotion-bundle.json \
            --destination "$DESTINATION" \
            --source-revision "$REVIEWED_REVISION" \
            --provenance-out promoted.provenance.json \
            > promotion-result.json
          image=$(jq -er '.image' promotion-result.json)
          case "$image" in "${DESTINATION%:*}"@sha256:*) ;; *) exit 1 ;; esac
          printf 'image=%s\n' "$image" >> "$GITHUB_OUTPUT"
          printf 'subject-name=%s\n' "${image%@sha256:*}" >> "$GITHUB_OUTPUT"
          printf 'subject-digest=sha256:%s\n' "${image##*@sha256:}" >> "$GITHUB_OUTPUT"
      - name: Preserve promotion evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: capsule-promotion-evidence-${{ inputs.artifact-run-id }}
          path: |
            promotion-result.json
            promoted.provenance.json
          if-no-files-found: error
          retention-days: 90
      - name: Attest promoted registry digest
        if: inputs.attest-registry-digest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.promote.outputs.subject-name }}
          subject-digest: ${{ steps.promote.outputs.subject-digest }}
          push-to-registry: true
      - name: Remove registry credentials
        if: ${{ always() }}
        run: docker logout ghcr.io || true
