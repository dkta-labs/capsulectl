name: Release

on:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
    steps:
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          printf '%s' "$RELEASE_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install Go from go.mod
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Test tagged source
        run: go test ./...
      - name: Build release archive
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -eu
          version=${RELEASE_TAG#v}
          archive="capsulectl_${version}_${GOOS}_${GOARCH}"
          mkdir -p "dist/$archive"
          suffix=
          if [ "$GOOS" = windows ]; then suffix=.exe; fi
          go build -trimpath -buildvcs=true -ldflags "-s -w -X github.com/dkta-labs/capsulectl/internal/capsule.Version=$version" -o "dist/$archive/capsulectl$suffix" ./cmd/capsulectl
          go build -trimpath -buildvcs=true -ldflags "-s -w -X github.com/dkta-labs/capsulectl/internal/capsule.Version=$version" -o "dist/$archive/capsule-promoter$suffix" ./cmd/capsule-promoter
          cp README.md LICENSE "dist/$archive/"
          if [ "$GOOS" = windows ]; then
            (cd dist && zip -q -r "$archive.zip" "$archive")
            printf 'artifact=%s\n' "dist/$archive.zip" >> "$GITHUB_ENV"
          else
            tar -C dist -czf "dist/$archive.tar.gz" "$archive"
            printf 'artifact=%s\n' "dist/$archive.tar.gz" >> "$GITHUB_ENV"
          fi
      - name: Upload release archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: capsulectl-${{ matrix.goos }}-${{ matrix.goarch }}
          path: ${{ env.artifact }}
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Download reviewed build outputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: capsulectl-*
          path: release-input
          merge-multiple: true
      - name: Create checksums
        run: sha256sum release-input/* > release-input/SHA256SUMS
      - name: Attest release artifacts
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: release-input/*
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" release-input/* --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
